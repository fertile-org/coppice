appId: dev.coppice.app
productName: Coppice
artifactName: Coppice-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - main.mjs
  - preload.cjs
  - src/**
  - static/**
  - package.json
extraResources:
  - from: resources
    to: .
mac:
  target: dmg
  category: public.app-category.developer-tools
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  icon: build/icon.png
  notarize: false
  # Regexes tested (unanchored) against each file's absolute path while signing;
  # Postgres share/ is data (timezones, SQL, locales), not Mach-O.
  signIgnore:
    - /Contents/Resources/postgres/share/
linux:
  target: deb
  category: Development
  maintainer: Coppice Maintainers <coppice@users.noreply.github.com>
  executableName: coppice
  # Per-size PNGs: hicolor has no 1024x1024 directory, so a single 1024 icon is never found.
  icon: build/icons
  # Debian short description (first line of control Description). The long
  # description is package.json "description".
  synopsis: Local board for your AI agent team
  desktop:
    entry:
      # Electron 35 sets WM_CLASS to ("coppice", "Coppice"): the instance is the
      # lowercased productName, the class is productName. desktopName
      # "coppice.desktop" sets the Wayland app_id to coppice, and the installed
      # desktop file is coppice.desktop. StartupWMClass has to be that same id.
      StartupWMClass: coppice
deb:
  # rc.1 and rc.2 shipped this package name. Keeping it lets a newer deb replace
  # the installed package instead of sitting beside it.
  packageName: coppice-desktop
  # Installed as /usr/share/metainfo/dev.coppice.app.metainfo.xml (fpm src=dest).
  fpm:
    - build/linux/dev.coppice.app.metainfo.xml=/usr/share/metainfo/dev.coppice.app.metainfo.xml
  # electron-builder's default deb depends (app-builder-lib FpmTarget) are replaced, not merged.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - git
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
  appArmorProfile: build/linux/apparmor-coppice
