# Local developer stack — alternate host ports to avoid conflicting with the
# default compose file used by agents and CI (deploy/docker-compose.yml).
#
# Host ports: Postgres 5433, API 8081. Web runs on the host via make web-dev-local.
# Start: make compose-local-up && make web-dev-local

name: coppice-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coppice
      POSTGRES_PASSWORD: coppice
      POSTGRES_DB: coppice
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coppice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - coppice_local_pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "8081:8080"
    environment:
      DATABASE_URL: postgres://coppice:coppice@postgres:5432/coppice
      COPPICE_CONFIG: /etc/coppice/config.yaml
      COPPICE_STORAGE__ARTIFACTS_DIR: /data/artifacts
    volumes:
      - coppice_local_artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  coppice_local_pgdata:
  coppice_local_artifacts:
