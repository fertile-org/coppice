# Local developer stack — Postgres only (alternate host port 5433).
# API and web run on the host for hot reload (make server-dev, make web-dev).
#
# Start: make compose-local-up
#
# Optional later: opt-in Ollama embedder like deploy/docker-compose.yml (profile
# `embeddings`, nomic-embed-text → http://127.0.0.1:11434/v1) for host API knowledge
# embeddings. Not required here — Postgres-only keeps human hot-reload light.

name: coppice-local

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coppice
      POSTGRES_PASSWORD: coppice
      POSTGRES_DB: coppice
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coppice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - coppice_local_pgdata:/var/lib/postgresql/data

volumes:
  coppice_local_pgdata:
