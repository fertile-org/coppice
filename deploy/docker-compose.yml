# Default stack for agents, CI, and make e2e-smoke (host ports 5432, 8080, 5173).
# For local testing without port conflicts, use docker-compose.local.yml instead.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coppice
      POSTGRES_PASSWORD: coppice
      POSTGRES_DB: coppice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coppice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - coppice_pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://coppice:coppice@postgres:5432/coppice
      COPPICE_CONFIG: /etc/coppice/config.yaml
      COPPICE_STORAGE__ARTIFACTS_DIR: /data/artifacts
      AGENT_DEFAULT_PROVIDER: mock
      WORKTREES_PATH: /data/worktrees
      AGENT_WORKER_COUNT: "2"
    volumes:
      - artifact_data:/data/artifacts
      - worktree_data:/data/worktrees
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://server:8080
    depends_on:
      - server

volumes:
  coppice_pgdata:
  artifact_data:
  worktree_data:
