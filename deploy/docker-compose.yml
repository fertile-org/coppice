# Default stack for agents, CI, and make e2e-smoke.
# Host ports are configurable so e2e-smoke is not gated on a free 5432/5000/5001.
# Override from the shell or a .env file, e.g.:
#   COPPICE_PG_PORT=55432 COPPICE_SERVER_PORT=15000 COPPICE_WEB_PORT=15001 make e2e-smoke
# When overriding the server port, point the smoke scripts at it too:
#   COPPICE_API_URL=http://localhost:15000 COPPICE_WEB_URL=http://localhost:15001
# Docker server config (copy example → config.toml, then edit; no rebuild needed):
#   cp deploy/config/config.example.toml deploy/config/config.toml
# Host git checkouts for agent work (Settings → Repositories use the in-container path):
#   COPPICE_REPOS_HOST=/path/to/checkouts  # default: $HOME/coppice/repos → /repos
# Run the API as your host user so writes under /repos keep your ownership:
#   COPPICE_UID=$(id -u) COPPICE_GID=$(id -g)  # make compose-up sets these
# Human hot-reload dev uses docker-compose.local.yml (Postgres :5433) + host API/web instead.
# Real agent CLIs: managed /home/coppice volume + `coppice connector …` (M08), not host bind-mounts.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coppice
      POSTGRES_PASSWORD: coppice
      POSTGRES_DB: coppice
    ports:
      - "${COPPICE_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coppice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - coppice_pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    ports:
      - "${COPPICE_SERVER_PORT:-5000}:5000"
    environment:
      DATABASE_URL: postgres://coppice:coppice@postgres:5432/coppice
      COPPICE_CONFIG: /etc/coppice/config.toml
      COPPICE_STORAGE__ARTIFACTS_DIR: /data/artifacts
      AGENT_DEFAULT_PROVIDER: mock
      WORKTREES_PATH: /data/worktrees
      AGENT_WORKER_COUNT: "2"
      WORKFLOW_AUTO_START_RUNS: "${WORKFLOW_AUTO_START_RUNS:-true}"
      COPPICE_KNOWLEDGE__EMBEDDING__PROVIDER: mock
      COPPICE_KNOWLEDGE__EMBEDDING__DIMENSION: "1536"
      MOCK_AGENT_RESPONSE: ${MOCK_AGENT_RESPONSE:-}
      SECRETS_MASTER_KEY: ${SECRETS_MASTER_KEY:-dev-master-key-change-me}
      # Default was silent when RUST_LOG unset; override e.g. RUST_LOG=debug
      RUST_LOG: ${RUST_LOG:-info}
      # Numeric host user for /repos ownership (entrypoint drops privileges).
      COPPICE_UID: ${COPPICE_UID:-1000}
      COPPICE_GID: ${COPPICE_GID:-1000}
      # Managed connector HOME (CLI binaries + auth). Keep /usr/sbin for gosu.
      HOME: /home/coppice
      PATH: /home/coppice/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - artifact_data:/data/artifacts
      - worktree_data:/data/worktrees
      - connector_data:/home/coppice
      # Operator-edited Docker config (gitignored). Writable so `coppice connector enable` works.
      - ./config/config.toml:/etc/coppice/config.toml
      # Operator git checkouts. Register /repos/<name> in Settings → Repositories.
      - ${COPPICE_REPOS_HOST:-${HOME}/coppice/repos}:/repos
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${COPPICE_WEB_PORT:-5001}:5001"
    environment:
      VITE_API_URL: http://server:5000
    depends_on:
      - server

volumes:
  coppice_pgdata:
  artifact_data:
  worktree_data:
  connector_data:
