services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: coppice
      POSTGRES_PASSWORD: coppice
      POSTGRES_DB: coppice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coppice"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - coppice_pgdata:/var/lib/postgresql/data

volumes:
  coppice_pgdata:
