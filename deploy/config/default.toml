# Baked into the Docker server image (see deploy/Dockerfile.server).
# Host / release installs use config.example.toml → config.toml instead.

[server]
port = 5000

[database]
url = "postgres://coppice:coppice@postgres:5432/coppice"

[auth]
session_secret = "dev-secret-change-me"
bootstrap_password = "changeme"
cookie_secure = false

[storage]
artifacts_dir = "/data/artifacts"
max_upload_bytes = 10485760

[agent]
default_connector = "mock"
worktrees_path = "/data/worktrees"
worker_count = 2

[agent.connectors.opencode]
enabled = false
command = "opencode"
serve_hostname = "127.0.0.1"
serve_port = 4096
model_providers = []

[agent.connectors.claude-code]
enabled = true
model_providers = ["sonnet", "opus", "haiku"]

[agent.connectors.codex]
enabled = false
model_providers = ["openai", "azure"]

[agent.connectors.kilo-code]
enabled = false
command = "kilo"
model_providers = []

[web]
port = 5001
static_dir = "./web/dist"

[workflow]
auto_start_runs = false

[workflow.auto_assign]
default = true
backlog = false

[knowledge]
enabled = true
worker_count = 1
poll_interval_ms = 500
stale_lock_secs = 300

[knowledge.embedding]
provider = "mock"
model = "coppice-mock-1536"
dimension = 1536
base_url = "https://api.openai.com/v1"
timeout_secs = 30

[knowledge.extraction]
provider = "mock"
max_source_bytes = 24000
max_candidates = 5

[knowledge.auto_save]
enabled = false
allowed_types = []
minimum_confidence = "high"

[knowledge.retrieval]
top_k = 8
allowed_types = []
minimum_confidence = "medium"
minimum_similarity = 0.0
default_page_size = 25
max_page_size = 100
max_active_per_project = 10000
max_active_workspace = 1000

[knowledge.context_budget]
max_tokens = 24000
ticket = 5000
latest_comments = 4000
project_rules = 3000
retrieved_knowledge = 4000
previous_attempt_summary = 2000
output_contract = 1000
