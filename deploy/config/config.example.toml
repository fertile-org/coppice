# Copy to config.toml in the repo root for local development.
# Optional global defaults: ~/.config/coppice/config.toml (lower priority than config.toml).

[server]
port = 5000

[database]
url = "postgres://coppice:coppice@localhost:5433/coppice"

[auth]
session_secret = "dev-secret-change-me"
bootstrap_password = "changeme"
cookie_secure = false
# Desktop product: open app as single local admin (no login UI). Set false for cloud/multi-user.
desktop_mode = true
# Create first admin on server start when users is empty (required for desktop_mode).
bootstrap_admin_email = "admin@localhost"
bootstrap_admin_password = "changeme"

[storage]
artifacts_dir = "./data/artifacts"
max_upload_bytes = 10485760

[agent]
# Desktop installers and `make release-tar` omit it; set a real connector there.
default_connector = "mock"
worktrees_path = "./data/worktrees"
worker_count = 2
health_check_interval_secs = 60

[agent.connectors.opencode]
enabled = false
command = "opencode"
# Each run spawns its own `opencode serve` on a free port on this host.
serve_hostname = "127.0.0.1"
# Ignored since M10 Part 2a (each run gets a free port); kept so existing config files still parse.
serve_port = 4096
# Max seconds Coppice waits for OpenCode session idle (default 1800 = 30 min).
# run_timeout_secs = 3600
model_providers = []
# model_providers = ["zai-coding-plan", "opencode-go", "opencode-zen", "alibaba"]

[agent.connectors.claude-code]
enabled = true
# run_timeout_secs = 3600
model_providers = ["sonnet", "opus", "haiku"]

[agent.connectors.codex]
enabled = false
# run_timeout_secs = 3600
model_providers = ["openai", "azure"]

[agent.connectors.kilo-code]
enabled = false
command = "kilo"
# run_timeout_secs = 3600
model_providers = []
# model_providers = ["anthropic", "openai"]

[agent.connectors.cursor]
enabled = false
command = "agent"
# run_timeout_secs = 3600
model_providers = []
# model_providers = ["cursor"]


[web]
port = 5001
static_dir = "./web/dist"  # used by `coppice web start`
# api_url = "http://127.0.0.1:5000"  # optional; defaults to server port

[workflow]
auto_start_runs = false

[workflow.auto_assign]
default = true
backlog = false

[workflow.auto_split]
default = false

[knowledge]
enabled = true
poll_interval_ms = 500

# Done tickets queue automatically; the compaction agent is chosen in the UI
# (Agents → Knowledge compaction). No agent selected means no compaction.
[knowledge.compaction]
interval_secs = 1800
batch_max_tickets = 10
batch_max_source_bytes = 200000
max_candidates_per_batch = 20
max_attempts = 3

[knowledge.auto_save]
enabled = false
allowed_types = []
minimum_confidence = "high"

[knowledge.retrieval]
top_k = 8
allowed_types = []
minimum_confidence = "medium"
default_page_size = 25
max_page_size = 100
max_active_per_board = 10000
max_active_workspace = 1000

[knowledge.context_budget]
max_tokens = 24000
ticket = 5000
latest_comments = 4000
project_rules = 3000
retrieved_knowledge = 4000
previous_attempt_summary = 2000
output_contract = 1000

# Encrypt forge tokens at rest (override with SECRETS_MASTER_KEY).
[secrets]
master_key = "dev-master-key-change-me"

# Author for Coppice commits in worktrees. Enable push for human Push / Create PR.
[git]
author_name = "Coppice"
author_email = "coppice@localhost"
push_enabled = true

# MCP tool gateway for agent CLIs. base_url defaults to http://127.0.0.1:<server.port>/mcp.
[mcp]
# base_url = "http://host.docker.internal:5000/mcp"
call_timeout_secs = 60
max_output_bytes = 32768
comment_post_limit = 5
token_ttl_secs = 14400
builtin_plugins_dir = "./data/builtin-plugins"

# User plugin dirs. The default dir is created on start and cannot be removed;
# Docker uses /data/plugins (plugin_data volume) via COPPICE_PLUGINS__DIR.
# [plugins]
# dir = "./data/plugins"
# allow_file_git_urls = false
# git_timeout_secs = 300
# Plugin MCP servers: start/list timeouts and idle shutdown of shared instances.
# mcp_start_timeout_secs = 20
# mcp_list_timeout_secs = 10
# mcp_idle_shutdown_secs = 600
