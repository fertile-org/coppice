[package]
name = "coppice-server"
version = "0.1.0"
edition = "2021"
default-run = "coppice-server"

[lib]
name = "coppice_server"
path = "src/lib.rs"

[[bin]]
name = "coppice-server"
path = "src/main.rs"

[[bin]]
name = "fake-opencode"
path = "tests/support/fake_opencode.rs"
required-features = ["embedded-test-db"]

[[bin]]
name = "fake-cli"
path = "tests/support/fake_cli.rs"
required-features = ["embedded-test-db"]

[[bin]]
name = "fake-mcp"
path = "tests/support/fake_mcp.rs"
required-features = ["embedded-test-db"]

[dependencies]
coppice-config = { path = "../config" }
coppice-connectors = { path = "../connectors" }
axum = { version = "0.8", features = ["multipart", "ws"] }
futures-util = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "time", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "parsing"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
dashmap = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
pg-embed = { version = "1.0", optional = true, default-features = false, features = ["rt_tokio_migrate"] }
fs4 = { version = "0.13", optional = true }
dirs = "6"
aes-gcm = "0.11.0"
base64 = "0.23.1"
toml = "0.8"
walkdir = "2"
zip = "2"
tempfile = "3"
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }
# The reqwest major rmcp's `StreamableHttpClient` is implemented for.
reqwest-mcp = { package = "reqwest", version = "0.13", default-features = false }

[features]
embedded-test-db = ["dep:pg-embed", "dep:fs4"]

[dev-dependencies]
http = "1"
http-body-util = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
