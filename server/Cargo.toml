[package]
name = "coppice-server"
version = "0.1.0"
edition = "2021"

[lib]
name = "coppice_server"
path = "src/lib.rs"

[[bin]]
name = "coppice-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
figment = { version = "0.10", features = ["yaml", "env"] }

[dev-dependencies]
http = "1"
http-body-util = "0.1"
