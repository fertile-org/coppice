[package]
name = "coppice-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "coppice"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "migrate"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
