name: Website

# Builds the Astro marketing site when it changes. The public site is
# https://getcoppice.app/, served by Vercel. This workflow does not
# deploy anywhere. GitHub Pages is only the apt repository and the macOS
# update feed, published by apt-repo.yml. A website deploy to that same
# Pages site would replace those files.

on:
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check docs placeholders
        working-directory: website
        run: node scripts/check-doc-placeholders.mjs
      - name: Check i18n paths
        working-directory: website
        run: node --experimental-strip-types --test src/i18n/i18n.test.ts
      - name: Check docs search
        working-directory: website
        run: node --experimental-strip-types --test src/lib/docs-search.test.ts
      - name: Check hero asset hashes
        working-directory: website
        run: node --experimental-strip-types --test src/lib/hero-assets.test.ts
      - name: Install and build
        working-directory: website
        run: npm ci && npm run build
      - name: Check internal links
        working-directory: website
        run: npm run check:links
      - name: Check i18n pages
        working-directory: website
        run: node scripts/check-i18n.mjs
      - name: Check download page
        working-directory: website
        run: npm run check:download && npm run check:download-page
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: website/dist
          if-no-files-found: error
          retention-days: 14
