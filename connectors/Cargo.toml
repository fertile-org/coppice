[package]
name = "coppice-connectors"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
name = "coppice_connectors"
path = "src/lib.rs"

[features]
# Off by default. Dev/test builds (Docker Compose, `cargo test`) opt in.
# Desktop and release-tar binaries leave it off so Mock is not a connector.
mock = []

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
