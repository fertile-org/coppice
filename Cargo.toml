[workspace]
members = ["config", "connectors", "db-migrations", "server", "cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"

# Password hashing is unusably slow unoptimized; every integration test logs in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
